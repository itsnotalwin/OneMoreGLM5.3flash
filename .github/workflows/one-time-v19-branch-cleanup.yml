name: One-time safely consolidate v19 recovery branches

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-v19-branch-cleanup.yml']

permissions:
  contents: write

jobs:
  archive-and-delete-only-verified-branches:
    if: github.repository == 'itsnotalwin/OneMoreGLM5.3flash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve recovery snapshots as tags, then remove their branch refs
        shell: bash
        run: |
          set -euo pipefail
          entries=(
            'automation/supabase-repair-23933a72964f|d051f570b9817d37c6a07b61cd2b315203970449'
            'automation/supabase-repair-a4460592b68c|7d950579187dd5212ec449abc559fb7b5db2a1ad'
            'automation/supabase-repair-c254f07afa30|e8e2e17a736a054eb6fbe3614690043ce7c21d1d'
          )
          mapfile -t all_heads < <(git ls-remote --heads origin | cut -f2 | sort)
          if [[ "${#all_heads[@]}" -ne 4 ]]; then
            printf 'Refusing cleanup: expected 4 heads, got %s\n' "${#all_heads[@]}" >&2
            exit 1
          fi
          [[ " ${all_heads[*]} " == *" refs/heads/main "* ]] || exit 1

          for entry in "${entries[@]}"; do
            IFS='|' read -r name sha <<< "$entry"
            actual="$(git ls-remote --heads origin "refs/heads/$name" | cut -f1)"
            [[ "$actual" == "$sha" ]] || { echo "Unexpected head: $name" >&2; exit 1; }
            git cat-file -e "$sha^{commit}"
            existing="$(git ls-remote --refs origin "refs/tags/$name" | cut -f1)"
            [[ -z "$existing" || "$existing" == "$sha" ]] || exit 1
          done

          for entry in "${entries[@]}"; do
            IFS='|' read -r name sha <<< "$entry"
            existing="$(git ls-remote --refs origin "refs/tags/$name" | cut -f1)"
            if [[ -z "$existing" ]]; then
              git tag "$name" "$sha"
              git push origin "refs/tags/$name:refs/tags/$name"
            fi
          done
          for entry in "${entries[@]}"; do
            IFS='|' read -r name sha <<< "$entry"
            tagged="$(git ls-remote --refs origin "refs/tags/$name" | cut -f1)"
            [[ "$tagged" == "$sha" ]] || { echo "Snapshot not preserved: $name" >&2; exit 1; }
          done

          for entry in "${entries[@]}"; do
            IFS='|' read -r name sha <<< "$entry"
            current="$(git ls-remote --heads origin "refs/heads/$name" | cut -f1)"
            [[ "$current" == "$sha" ]] || exit 1
            git push origin ":refs/heads/$name"
          done
          mapfile -t remaining < <(git ls-remote --heads origin | cut -f2)
          [[ "${#remaining[@]}" -eq 1 && "${remaining[0]}" == 'refs/heads/main' ]] || exit 1
          echo "Verified: only main remains. Three recovery snapshots preserved as tags."
          echo "Single branch verified. Three former recovery branches safely archived as tags." >> "$GITHUB_STEP_SUMMARY"

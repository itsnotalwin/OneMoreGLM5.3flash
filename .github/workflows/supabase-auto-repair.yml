name: Validate Supabase repair (single-branch, review patch only)

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Supabase integration guard"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: one-more-supabase-repair-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  safe-self-test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prove the recovery planner fails closed on unknown code
        run: node .github/supabase-auto-repair.cjs --self-test
      - name: Check today's integrated source without modifying files
        run: node .github/supabase-auto-repair.cjs --dry-run

  prepare-review-patch:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test safe recovery on old snapshots
        run: node .github/supabase-auto-repair.cjs --self-test
      - name: Plan ONLY known Supabase and OAuth corrections
        id: plan
        run: node .github/supabase-auto-repair.cjs --repair
      - name: Validate repaired code and strict five-file scope
        if: steps.plan.outputs.changed == 'true'
        run: |
          node .github/supabase-auto-repair.cjs --verify
          node --check js/supabase-config.js
          node --check js/lb.js
          node --check js/main.js
          node --check sw.js
          git diff --check
      # GitHub Actions is not permitted to create PRs in this repository.
      # A PR needs a second branch, contrary to the owner's one-branch policy.
      # Generate a reviewable patch as an Actions artifact. NEVER push branches.
      - name: Prepare patch for owner review (no new branch, no merge)
        if: steps.plan.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary -- js/supabase-config.js js/lb.js js/main.js index.html sw.js > "${RUNNER_TEMP}/one-more-integration-repair.patch"
          test -s "${RUNNER_TEMP}/one-more-integration-repair.patch"
          {
            echo "## ONE MORE integration repair proposal"
            echo "The Supabase guard detected overwritten integration code."
            echo "A guarded **five-file patch** was prepared but **NOT applied to main**."
            echo "No extra Git branch or PR was created."
            echo "Inspect the \`one-more-integration-repair-patch\` workflow artifact and review changes before applying."
            echo "Gameplay, artwork and database were not modified."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload guarded repair patch for review
        if: steps.plan.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: one-more-integration-repair-patch
          path: ${{ runner.temp }}/one-more-integration-repair.patch
          retention-days: 30
          if-no-files-found: error

name: Cloud save safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/engine/cloud-save.js'
      - 'src/engine/lb.js'
      - 'src/engine/main.js'
      - 'src/engine/boot.ts'
      - 'public/sw.js'
      - 'index.src.html'
      - 'scripts/build.cjs'
      - '.github/workflows/cloud-save-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cross-device-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate modified JavaScript
        run: |
          node --check src/engine/cloud-save.js
          node --check src/engine/lb.js
          node --check src/engine/main.js
          node --check public/sw.js
      - name: Confirm source diff cleanliness
        run: git diff --check

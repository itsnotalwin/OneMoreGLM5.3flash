name: Archive old branch snapshots and keep only main (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branch-consolidation.yml'

permissions:
  contents: write

jobs:
  preserve-and-consolidate:
    if: github.repository == 'itsnotalwin/OneMoreGLM5.3flash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify every branch, preserve exact snapshots as tags, prune non-main branches
        shell: bash
        run: |
          set -euo pipefail

          # Exact reviewed branch heads. No wildcard deletions, no force pushes.
          entries=(
            'backup/manual-upload-2026-11-05|2a50e76206a86124fb1b0bf81850db6b33995cb5'
            'backup/pre-cloud-saves-2026-11-04|c76ef6ec978f867342d74f77d04826609047cd02'
            'backup/supabase-integration-2026-11-02|2e844ba957e3e8dcfb4dd4da33eb21357be46abe'
            'backup/v12-manual-upload-2026-11-03|fb9083507e81f69fbf092f626f8ba0b70bff8d7d'
            'backup/v16-manual-upload-2026-11-03|94267ab9d0789f0f7f65dcf2e62f0a1fae68bea1'
            'backup/v18-1-manual-upload-2026-11-03|8def891bc3adccb2c4018f84f5618fbfcd22bbfe'
            'backup/v18-manual-upload-2026-11-03|e4f63bda480a1c199900c77b8dfeb58ed8938e53'
            'feature/cloud-saves-2026-11-04|e2aac99e4f2b697fd0b6ffe52c24378896826ebb'
          )

          # Fail closed if another agent/user creates a branch or modifies a ref.
          mapfile -t actual < <(git ls-remote --heads origin | cut -f2 | sed 's|^refs/heads/||' | sort)
          if [[ "${#actual[@]}" -ne 9 ]]; then
            printf 'Expected main + 8 reviewed branches; found %s\n' "${#actual[@]}" >&2
            printf 'Found: %s\n' "${actual[@]}" >&2
            exit 1
          fi
          [[ " ${actual[*]} " == *" main "* ]] || { echo 'main missing' >&2; exit 1; }

          for entry in "${entries[@]}"; do
            IFS='|' read -r name expected <<< "$entry"
            remote="$(git ls-remote --heads origin "refs/heads/$name" | cut -f1)"
            if [[ "$remote" != "$expected" ]]; then
              echo "STOP: unexpected branch head for $name" >&2
              exit 1
            fi
            git cat-file -e "$expected^{commit}"
            existing_tag="$(git ls-remote --refs origin "refs/tags/$name" | cut -f1)"
            if [[ -n "$existing_tag" && "$existing_tag" != "$expected" ]]; then
              echo "STOP: tag already exists at different commit: $name" >&2
              exit 1
            fi
          done

          # Preserve exact snapshots under same names as tags, not branches.
          for entry in "${entries[@]}"; do
            IFS='|' read -r name expected <<< "$entry"
            existing_tag="$(git ls-remote --refs origin "refs/tags/$name" | cut -f1)"
            if [[ -z "$existing_tag" ]]; then
              git tag "$name" "$expected"
              git push origin "refs/tags/$name:refs/tags/$name"
            fi
          done

          # Never delete any branch until EVERY archival tag is verified.
          for entry in "${entries[@]}"; do
            IFS='|' read -r name expected <<< "$entry"
            got="$(git ls-remote --refs origin "refs/tags/$name" | cut -f1)"
            if [[ "$got" != "$expected" ]]; then
              echo "STOP: snapshot tag not verified for $name" >&2
              exit 1
            fi
          done

          for entry in "${entries[@]}"; do
            IFS='|' read -r name expected <<< "$entry"
            current="$(git ls-remote --heads origin "refs/heads/$name" | cut -f1)"
            [[ "$current" == "$expected" ]] || { echo "STOP: changed $name" >&2; exit 1; }
            git push origin ":refs/heads/$name"
          done

          mapfile -t remaining < <(git ls-remote --heads origin | cut -f2)
          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != 'refs/heads/main' ]]; then
            printf 'STOP: unexpected remaining branches: %s\n' "${remaining[*]}" >&2
            exit 1
          fi
          echo "Verified: only main remains; eight same-name tags preserve snapshots."
          echo "### Branch consolidation verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Only **main** remains. Eight old branch heads were preserved as tags at identical SHAs." >> "$GITHUB_STEP_SUMMARY"

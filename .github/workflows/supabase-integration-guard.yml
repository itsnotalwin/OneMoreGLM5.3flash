name: Supabase integration guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-supabase-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check src/engine/supabase-config.js
          node --check src/engine/lb.js
          node --check src/engine/main.js
          node --check src/engine/cloud-save.js
          node --check src/engine/game.js
          node --check src/engine/charms.js
          node --check src/engine/codex.js
          node --check public/sw.js
          node --check scripts/build.cjs
      - name: Build the site
        run: |
          npm ci
          npm run build
      - name: Detect overwritten Supabase and Google OAuth wiring
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const issues = [];
          const read = (path) => {
            try { return fs.readFileSync(path, 'utf8'); }
            catch { issues.push('Missing ' + path); return ''; }
          };
          const assert = (condition, message) => { if (!condition) issues.push(message); };
          const config = read('src/engine/supabase-config.js');
          const lb = read('src/engine/lb.js');
          const cloud = read('src/engine/cloud-save.js');
          const main = read('src/engine/main.js');
          const boot = read('src/engine/boot.ts');
          const charms = read('src/engine/charms.js');
          const sw = read('public/sw.js');
          const cfg = read('src/engine/config.js');
          const index = read('index.html');

          assert(config.includes('https://sffpyvxbgmhepftxoesy.supabase.co'),
            'Supabase URL no longer targets the shared Pinpoint project');
          assert(/anonKey\s*:\s*['"]sb_publishable_[^'"]+['"]/.test(config),
            'Public publishable key missing from src/engine/supabase-config.js');
          assert(!/anonKey\s*:\s*['"]sb_secret_/.test(config),
            'Forbidden secret key in public JS config');
          assert(lb.includes("from('om_scores')") && lb.includes("from('om_daily')"),
            'Separate ONE MORE leaderboard tables missing');
          assert(lb.includes('auth.signInAnonymously'),
            'Anonymous sign-in client flow missing');
          assert(lb.includes("provider: 'google'") || lb.includes('provider: "google"'),
            'Google OAuth sign-in client flow missing');
          assert(lb.includes("flowType: 'pkce'") && lb.includes('detectSessionInUrl: true'),
            'Google OAuth PKCE callback handling missing');
          assert(lb.includes('om_lb_google_return_v1') && lb.includes('consumeOAuthReturn') &&
            lb.includes('cloudAccess()'),
            'Short-lived Google callback/board context restoration missing');
          assert(lb.includes('unable to exchange external code'),
            'Actionable token-exchange error handling missing');
          assert(main.includes('LB.consumeOAuthReturn()') && main.includes('LB.open(') &&
            main.includes('LB.initAuth()'),
            'Startup no longer restores the leaderboard after Google OAuth');
          assert(lb.includes("from('om_weekly')") && lb.includes('has_ghost') &&
            lb.includes('fetchEcho(') && lb.includes('raceEcho('),
            'v12 weekly leaderboard or ghost-racing integration missing');
          assert(lb.includes('renderWeeklyRows') && lb.includes('om_lb_google_return_v1'),
            'v12 weekly tab must survive Google OAuth navigation');
          assert(cloud.includes("om_player_saves") && cloud.includes('beforeLocalWipe') &&
            cloud.includes('restoreSnapshot') && cloud.includes('saveToCloud'),
            'Private cloud-save migration/sync module missing');
          assert(main.includes('beforeLocalWipe()'),
            'Local-wipe cloud protection hook missing');

          /* v25.0 THE FABLE ADOPTED: the engine rides to the page through
             boot.ts's ?raw bridge — every module the cloud flow needs must
             be on that bridge, and the charms room is part of the game now */
          for (const m of ['config.js', 'supabase-config.js', 'lb.js', 'cloud-save.js',
            'main.js', 'charms.js', 'codex.js']) {
            assert(boot.includes(`'./${m}?raw'`), `boot.ts no longer imports ${m}`);
          }
          assert(cfg.includes('CHARMS') && charms.includes('charmLv'),
            'The charms economy was dropped from the adopted build');
          assert(fs.existsSync('src/engine/codex.js'), 'The codex module is missing');

          assert(/const VER\s*=\s*['"][^'"]+['"]/.test(sw),
            'PWA cache version missing');
          assert(sw.includes("'snd/om_title.mp3'") && sw.includes("'img/wash_cliff.webp'"),
            'PWA core cache lost its sound and wash assets');

          /* the committed root artifact must carry the running version */
          const engineVer = (cfg.match(/OM_VERSION\s*=\s*'([^']+)'/) || [])[1];
          assert(engineVer && index.includes(engineVer),
            `The committed root index.html is stale — run npm run build:site (engine is ${engineVer})`);

          if (issues.length) {
            console.error('Supabase integration REGRESSION after this push:');
            issues.forEach(x => console.error(' - ' + x));
            console.error('Recovery: SUPABASE-RECOVERY.md');
            process.exitCode = 1;
          } else {
            console.log('Supabase source wiring preserved. Auth providers and live login require separate verification.');
          }
          NODE
